[project]
name = "blotto"
version = "0.1.0"
description = "Strategy pipeline for the Maroon Capital 2026 challenge, a Colonel Blotto variant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blotto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
